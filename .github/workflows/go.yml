name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Start API server
        run: |
          go run . > server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail http://localhost:3000/v1/health; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Start webhook receivers
        run: |
          go run ./webhook --port 4001 > webhook-4001.log 2>&1
          sleep 2
          cat webhook-4001.log

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run local k6 test
        uses: grafana/run-k6-action@v1
        with:
          path: test.js