name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Start API server
        run: |
          go run . > server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail http://localhost:3000/v1/health; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Start webhook receivers
        run: |
          go run ./webhook > webhook.log 2>&1
          WEBHOOK_PID=$!
          for i in {1..30}; do
            if ! kill -0 "$WEBHOOK_PID" 2>/dev/null; then
              cat webhook.log
              exit 1
            fi
          
            if curl --silent --output /dev/null \
              --requst POST \
              --data '{}' \
              http://localhost:4001/webhook; then
              echo "Webhook ewceivwe is ready"
              exit 0
            fi
          
            sleep 1
          done
          
          cat webhook.log
          echo "Webhook receiver not ready"
          exit 1

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run local k6 test
        uses: grafana/run-k6-action@v1
        with:
          path: test.js